{{- define "main" }}
<article class="post-single">
  <header class="post-header">
    <h1 class="post-title">{{ .Title }}</h1>
    {{- if .Description }}
    <div class="post-description">{{ .Description }}</div>
    {{- end }}
  </header>
  <div class="post-content">
    {{- .Content }}
  </div>
</article>

<style>
  .post-content input,
  .post-content textarea,
  .post-content select {
    width: 100%;
    padding: 10px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--entry);
    color: var(--primary);
    font-size: 1rem;
    font-family: inherit;
    outline: none;
    box-sizing: border-box;
    transition: border-color 0.2s;
  }
  .post-content input:focus,
  .post-content textarea:focus {
    border-color: var(--primary);
  }
  .post-content button[type="submit"] {
    padding: 12px 28px;
    background: var(--primary);
    color: var(--theme);
    border: none;
    border-radius: 6px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .post-content button[type="submit"]:hover {
    opacity: 0.85;
  }
</style>

<script>
  // Formspree AJAX submit — sayfa yönlendirmesi olmadan
  const form = document.querySelector('form[action*="formspree"]');
  if (form) {
    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      const data = new FormData(form);
      const btn = form.querySelector('button[type="submit"]');
      const originalText = btn.innerText;
      btn.innerText = "Sending...";
      btn.disabled = true;
      try {
        const res = await fetch(form.action, {
          method: "POST",
          body: data,
          headers: { Accept: "application/json" },
        });
        if (res.ok) {
          form.innerHTML = `<div style="padding: 24px; border-radius: 8px; background: var(--entry); border: 1px solid var(--border); text-align: center;">
            <p style="font-size: 1.2rem; font-weight: 600; margin-bottom: 8px;">✅ Message sent!</p>
            <p style="opacity: 0.7;">Thank you for reaching out. I'll get back to you shortly.</p>
          </div>`;
        } else {
          btn.innerText = originalText;
          btn.disabled = false;
          alert("Something went wrong. Please try again or email directly.");
        }
      } catch (err) {
        btn.innerText = originalText;
        btn.disabled = false;
        alert("Network error. Please try again.");
      }
    });
  }
</script>
{{- end }}
